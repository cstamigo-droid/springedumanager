spring.application.name=SpringEduManager

# Etapa 3: base de datos embebida H2
spring.datasource.url=jdbc:h2:mem:edumanager;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Para cambiar a MySQL basta reemplazar las 4 lineas del datasource:
# spring.datasource.url=jdbc:mysql://localhost:3306/edumanager
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=tu_clave

# Etapa 4: usuarios de la aplicacion, configurados aqui (Leccion 4).
# DatosIniciales los lee al arrancar y los guarda en la tabla USUARIO con la
# contrasena hasheada en BCrypt. Cambiar el usuario o la clave es editar estas
# lineas: no hay que tocar codigo.
edumanager.usuarios.admin.nombre=admin
edumanager.usuarios.admin.clave=admin123
edumanager.usuarios.estudiante.nombre=estudiante
edumanager.usuarios.estudiante.clave=est123
