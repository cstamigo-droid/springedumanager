spring.application.name=SpringEduManager

# Motor de base de datos: DB_ENGINE=h2 (por defecto) | mariadb | mysql | postgresql
# Cada motor tiene su archivo application-<motor>.properties. Ejemplo:
#   set DB_ENGINE=mariadb  (Windows)   /   DB_ENGINE=mariadb java -jar ... (Linux/macOS)
spring.profiles.active=${DB_ENGINE:h2}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false

# Actuator: estado de la aplicacion
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

# Log en archivo ademas de consola
logging.file.name=logs/springedumanager.log
logging.level.cl.bootcamp.springedumanager=DEBUG

# Etapa 4: usuarios de la aplicacion, configurados aqui (Leccion 4).
# DatosIniciales los lee al arrancar y los guarda en la tabla USUARIO con la
# contrasena hasheada en BCrypt. Cambiar el usuario o la clave es editar estas
# lineas: no hay que tocar codigo.
edumanager.usuarios.admin.nombre=admin
edumanager.usuarios.admin.clave=admin123
edumanager.usuarios.estudiante.nombre=estudiante
edumanager.usuarios.estudiante.clave=est123

# Etapa 5 (plus): JWT para la API REST. POST /api/auth/token devuelve el token.
# Cambiar la clave en un despliegue real (variable de entorno APP_JWT_SECRET).
app.jwt.secret=${APP_JWT_SECRET:springedumanager-clave-de-clase-cambiar-en-produccion-2026}
app.jwt.expiracion-minutos=${APP_JWT_MINUTOS:120}

# Interoperabilidad: URL base que usa RestTemplate para consumir los servicios.
# Vacia = se arma sola con el puerto real en que arranco la aplicacion.
app.base-url=${APP_BASE_URL:}
