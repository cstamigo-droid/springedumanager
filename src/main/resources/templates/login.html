<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>SpringEduManager — Ingreso</title>
  <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
  <main class="login">
    <h2>SpringEduManager</h2>
    <div th:if="${param.error}" class="aviso mal">Usuario o contrasena incorrectos.</div>
    <div th:if="${param.logout}" class="aviso ok">Sesion cerrada correctamente.</div>
    <form class="tarjeta" th:action="@{/login}" method="post">
      <label>Usuario <input type="text" name="username" required autofocus></label>
      <label>Contrasena <input type="password" name="password" required></label>
      <button class="btn" type="submit">Ingresar</button>
    </form>
  </main>
</body>
</html>
