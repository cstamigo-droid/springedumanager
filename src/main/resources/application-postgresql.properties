# Perfil postgresql: DB_ENGINE=postgresql. Crear antes la base:  CREATE DATABASE edumanager;
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/edumanager}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
